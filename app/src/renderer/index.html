<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'">
  <title>Claude セッション</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="titlebar">
    <span class="app-name">Claude</span>
    <span class="spacer"></span>
    <button id="collapse" class="icon-button" title="たたむ" aria-label="たたむ">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3l5 5-5 5"/></svg>
    </button>
    <button id="quit" class="icon-button" title="終了" aria-label="終了">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg>
    </button>
  </header>

  <!-- リポジトリごとのカード -->
  <main id="cards"></main>

  <!-- たたんだときの表示：リポジトリの頭文字の丸 -->
  <aside id="mini"></aside>

  <template id="card-template">
    <section class="card">
      <h2 class="card-header">
        <span class="repo-name"></span>
        <span class="badge"></span>
      </h2>
      <div class="card-body"></div>
      <div class="stopped">
        <button class="stopped-toggle">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 4l4 4-4 4"/></svg>
          <span class="stopped-label"></span>
        </button>
        <ul class="rows stopped-rows"></ul>
      </div>
    </section>
  </template>

  <template id="subhead-template">
    <div class="subhead">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path class="icon-path"/></svg>
      <span class="subhead-label"></span>
    </div>
  </template>

  <template id="row-template">
    <li class="row" tabindex="0">
      <span class="status"></span>
      <span class="text">
        <span class="title"></span>
        <span class="meta"><span class="branch"></span><span class="when"></span></span>
      </span>
    </li>
  </template>

  <script type="module" src="renderer.js"></script>
</body>
</html>
