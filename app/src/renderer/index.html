<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'">
  <title>Bantus</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="titlebar">
    <img class="app-icon" src="icon.svg" alt="">
    <span class="app-name">Bantus</span>
    <span class="spacer"></span>
    <button id="pin" class="icon-button" data-tip="最前面に固定中（クリックで外す）" aria-label="最前面に固定" aria-pressed="true" data-icon="pin"></button>
    <button id="settings" class="icon-button" data-tip="設定" aria-label="設定" data-icon="settings"></button>
  </header>

  <!-- 内側の端。ドラッグで幅を変える -->
  <div id="resize-handle" class="resize-handle" data-tip="ドラッグで幅を変える"></div>

  <!-- リポジトリごとのカード。data-icon の要素には icon.ts が lucide のアイコンを入れる -->
  <main id="cards"></main>

  <template id="card-template">
    <section class="card">
      <h2 class="card-header">
        <span class="card-icon" data-icon="folder"></span>
        <span class="repo-name"></span>
        <span class="changes" tabindex="0" hidden></span>
        <span class="badge"></span>
      </h2>
      <div class="card-body"></div>
    </section>
  </template>

  <!-- 折りたたみ：上限で隠したセッションと停止中。行を選ぶか、外をクリックするか、Esc で閉じる -->
  <template id="fold-template">
    <div class="fold">
      <button class="fold-toggle">
        <span class="fold-icon" data-icon="chevron-right"></span>
        <span class="fold-text"><span class="when-closed">すべて表示</span><span class="when-open">折りたたむ</span></span>
        <span class="fold-counts">
          <span class="fold-count" data-state="busy"><span class="status"></span><span class="n"></span></span>
          <span class="fold-count" data-state="idle"><span class="status"></span><span class="n"></span></span>
          <span class="fold-count" data-state="stopped"><span class="status"></span><span class="n"></span></span>
          <span class="fold-changes" hidden><span class="fold-changes-icon" data-icon="file-pen-line"></span><span class="n"></span></span>
        </span>
      </button>
      <div class="fold-body">
        <ul class="rows fold-hidden"></ul>
        <div class="fold-sep">停止中</div>
        <ul class="rows fold-stopped"></ul>
      </div>
    </div>
  </template>

  <template id="subhead-template">
    <div class="subhead">
      <span class="subhead-icon"></span>
      <span class="subhead-label"></span>
      <span class="changes" tabindex="0" hidden></span>
    </div>
  </template>

  <template id="row-template">
    <li class="row" tabindex="0">
      <span class="status"></span>
      <span class="seq"></span>
      <span class="text">
        <span class="title"></span>
        <span class="meta"><span class="branch"></span><span class="when"></span></span>
      </span>
      <button class="keep" tabindex="-1" aria-label="常に表示" data-icon="star"></button>
    </li>
  </template>


  <script type="module" src="renderer.js"></script>
</body>
</html>
