<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'">
  <title>Bantus</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="titlebar">
    <img class="app-icon" src="icon.svg" alt="">
    <span class="app-name">Bantus</span>
    <span class="spacer"></span>
    <button id="pin" class="icon-button" data-tip="最前面に固定中（クリックで外す）" aria-label="最前面に固定" aria-pressed="true" data-icon="pin"></button>
    <button id="settings" class="icon-button" data-tip="設定" aria-label="設定" data-icon="settings"></button>
  </header>

  <!-- 内側の端。ドラッグで幅を変える -->
  <div id="resize-handle" class="resize-handle" data-tip="ドラッグで幅を変える"></div>

  <!-- リポジトリの見出しと、ワークツリーごとのカード。data-icon の要素には icon.ts が lucide のアイコンを入れる -->
  <main id="cards"></main>

  <!-- リポジトリ：見出し（名前、カードごとアーカイブした件数、バッジ）とカードの並び -->
  <template id="repo-template">
    <section class="repo">
      <h2 class="repo-header">
        <span class="repo-icon" data-icon="folder"></span>
        <span class="repo-name"></span>
        <button class="repo-archived" hidden><span class="repo-archived-icon" data-icon="archive"></span><span class="n"></span></button>
        <span class="spacer"></span>
        <span class="badge"></span>
      </h2>
      <div class="repo-cards"></div>
    </section>
  </template>

  <!-- ワークツリー（元のフォルダを含む）のカード。以前のセッションがあれば、後ろに重なりを 1 枚出す。
       重なりに乗せると、めくれと一覧を別のウィンドウ（flyout.html）に出す -->
  <template id="card-template">
    <div class="card-wrap">
      <div class="stack" aria-hidden="true"></div>
      <div class="stack-hit"></div>
      <section class="card">
        <div class="card-header">
          <!-- ブランチのアイコン。押すとカードの保留を切り替える（docs/design/hold.md） -->
          <span class="card-icon toggle"><span class="toggle-ic"><span class="now"></span><span class="alt"></span></span></span>
          <span class="card-label"></span>
          <span class="changes" tabindex="0" hidden></span>
          <button class="act card-act" tabindex="-1" aria-label="カードをアーカイブ" data-tip="カードをアーカイブ" data-icon="archive"></button>
          <!-- 保留の間だけ出す 2 段目：「保留」の文字とメモの枠 -->
          <div class="card-hold" hidden><span class="state-pill">保留</span><span class="memo"><span class="memo-pen" data-icon="pencil"></span><span class="memo-text"></span><textarea rows="1" spellcheck="false" aria-label="保留の理由のメモ"></textarea></span></div>
        </div>
        <ul class="rows"></ul>
      </section>
    </div>
  </template>

  <template id="row-template">
    <li class="row" tabindex="0">
      <!-- 状態の印。待機・停止中の行では、押すと保留を切り替える（docs/design/hold.md） -->
      <span class="status toggle"><span class="toggle-ic"><span class="now"></span><span class="alt"></span></span></span>
      <span class="text">
        <span class="title"></span>
        <span class="meta"><span class="state-pill"></span><span class="when"></span><span class="ctx" hidden></span><span class="memo" hidden><span class="memo-pen" data-icon="pencil"></span><span class="memo-text"></span><textarea rows="1" spellcheck="false" aria-label="保留の理由のメモ"></textarea></span></span>
      </span>
      <button class="act" tabindex="-1" aria-label="アーカイブ" data-icon="archive"></button>
    </li>
  </template>

  <script type="module" src="renderer.js"></script>
</body>
</html>
