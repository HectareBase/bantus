<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'">
  <title>Bantus</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="titlebar">
    <img class="app-icon" src="icon.svg" alt="">
    <span class="app-name">Bantus</span>
    <span class="spacer"></span>
    <button id="settings" class="icon-button" data-tip="設定" aria-label="設定" data-icon="settings"></button>
    <button id="collapse" class="icon-button" data-tip="たたむ" aria-label="たたむ" data-icon="chevron-right"></button>
    <button id="pin" class="icon-button" data-tip="最前面に固定中（クリックで外す）" aria-label="最前面に固定" aria-pressed="true" data-icon="pin"></button>
  </header>

  <!-- 内側の端。ドラッグで幅を変える -->
  <div id="resize-handle" class="resize-handle" data-tip="ドラッグで幅を変える"></div>

  <!-- リポジトリごとのカード。data-icon の要素には icon.ts が lucide のアイコンを入れる -->
  <main id="cards"></main>

  <!-- たたんだときの表示：リポジトリの頭文字の丸 -->
  <aside id="mini"></aside>

  <template id="card-template">
    <section class="card">
      <h2 class="card-header">
        <span class="card-icon" data-icon="folder"></span>
        <span class="repo-name"></span>
        <span class="badge"></span>
      </h2>
      <div class="card-body"></div>
      <div class="stopped">
        <button class="stopped-toggle">
          <span class="stopped-icon" data-icon="chevron-right"></span>
          <span class="stopped-label"></span>
        </button>
        <ul class="rows stopped-rows"></ul>
      </div>
    </section>
  </template>

  <template id="subhead-template">
    <div class="subhead">
      <span class="subhead-icon"></span>
      <span class="subhead-label"></span>
    </div>
  </template>

  <template id="row-template">
    <li class="row" tabindex="0">
      <span class="status"></span>
      <span class="text">
        <span class="title"></span>
        <span class="meta"><span class="branch"></span><span class="when"></span></span>
      </span>
    </li>
  </template>

  <!-- ツールチップ（tooltip.ts）。1 つを使い回す -->
  <div id="tooltip" class="tooltip" popover="hint" role="tooltip"></div>

  <script type="module" src="renderer.js"></script>
</body>
</html>
