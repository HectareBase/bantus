<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'">
  <title>Bantus</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="titlebar">
    <img class="app-icon" src="icon.svg" alt="">
    <span class="app-name">Bantus</span>
    <span class="spacer"></span>
    <!-- PC 全体の CPU とメモリ（system-usage.ts）。各段はラベル・短いバー・数字。狭いときはバー 2 本だけにする -->
    <div id="usage" class="usage" hidden>
      <div id="usage-cpu" class="usage-row" tabindex="-1"><span class="usage-label" data-i18n="widget.cpuLabel"></span><span class="usage-bar"><span class="usage-fill"></span></span><span class="usage-num"></span></div>
      <div id="usage-mem" class="usage-row" tabindex="-1"><span class="usage-label" data-i18n="widget.memLabel"></span><span class="usage-bar"><span class="usage-fill"></span></span><span class="usage-num"></span></div>
    </div>
    <button id="pin" class="icon-button" data-i18n-tip="widget.pinned" data-i18n-aria-label="widget.pinAria" aria-pressed="true" data-icon="pin"></button>
    <button id="settings" class="icon-button" data-i18n-tip="widget.settings" data-i18n-aria-label="widget.settings" data-icon="settings"></button>
  </header>

  <!-- 内側の端。ドラッグで幅を変える -->
  <div id="resize-handle" class="resize-handle" data-i18n-tip="widget.resize"></div>

  <!-- リポジトリの見出しと、ワークツリーごとのカード。data-icon の要素には icon.ts が lucide のアイコンを入れる -->
  <main id="cards"></main>

  <!-- HTML ビューア（docs/design/html-viewer.md）：高さを変えるつまみ、見出し、HTML の場所。
       HTML はメインプロセスが #viewer-slot の上に別のビュー（WebContentsView）で重ねる。出せないときは下の文字が見える -->
  <section id="viewer" class="viewer" hidden data-i18n-aria-label="viewer.aria">
    <div id="viewer-grip" class="viewer-grip" data-i18n-tip="viewer.resize"></div>
    <div class="viewer-box">
      <div class="viewer-header">
        <span class="viewer-file"></span>
        <span class="viewer-place"></span>
        <span class="spacer"></span>
        <button id="viewer-reload" class="icon-button" data-i18n-tip="viewer.reload" data-i18n-aria-label="viewer.reload" data-icon="rotate-cw"></button>
        <button id="viewer-external" class="icon-button" data-i18n-tip="viewer.openExternal" data-i18n-aria-label="viewer.openExternal" data-icon="external-link"></button>
        <button id="viewer-collapse" class="icon-button" aria-expanded="true"></button>
      </div>
      <div id="viewer-slot" class="viewer-slot">
        <div class="viewer-empty"><span class="viewer-message"></span><span class="viewer-path"></span></div>
      </div>
    </div>
  </section>

  <!-- リポジトリ：見出し（名前、バッジ、カードごとアーカイブした件数）とカードの並び。件数は右端に置く -->
  <template id="repo-template">
    <section class="repo">
      <h2 class="repo-header">
        <span class="repo-icon" data-icon="folder"></span>
        <span class="repo-name"></span>
        <span class="spacer"></span>
        <span class="badge"></span>
        <button class="repo-archived" hidden><span class="repo-archived-icon" data-icon="archive"></span><span class="n"></span></button>
      </h2>
      <div class="repo-cards"></div>
    </section>
  </template>

  <!-- ワークツリー（元のフォルダを含む）のカード。以前のセッションがあれば、後ろに重なりを 1 枚出す。
       重なりに乗せると、めくれと一覧を別のウィンドウ（flyout.html）に出す -->
  <template id="card-template">
    <div class="card-wrap">
      <div class="stack" aria-hidden="true"></div>
      <div class="stack-hit"></div>
      <section class="card">
        <div class="card-header">
          <!-- ブランチのアイコン。押すとカードの保留を切り替える（docs/design/hold.md） -->
          <span class="card-icon toggle"><span class="toggle-ic"><span class="now"></span><span class="alt"></span></span></span>
          <span class="card-label"></span>
          <span class="changes" tabindex="0" hidden></span>
          <button class="act card-act" tabindex="-1" data-i18n-aria-label="widget.archiveCard" data-i18n-tip="widget.archiveCard" data-icon="archive"></button>
          <!-- 保留の間だけ出す 2 段目：「保留」の文字とメモの枠 -->
          <div class="card-hold" hidden><span class="state-pill" data-i18n="state.held"></span><span class="memo"><span class="memo-pen" data-icon="pencil"></span><span class="memo-text"></span><textarea rows="1" spellcheck="false" data-i18n-aria-label="widget.holdNoteAria"></textarea></span></div>
        </div>
        <ul class="rows"></ul>
      </section>
    </div>
  </template>

  <template id="row-template">
    <li class="row" tabindex="0">
      <!-- 状態の印。待機・停止中の行では、押すと保留を切り替える（docs/design/hold.md） -->
      <span class="status toggle"><span class="toggle-ic"><span class="now"></span><span class="alt"></span></span></span>
      <span class="text">
        <span class="title"></span>
        <span class="meta"><span class="state-pill"></span><span class="when"></span><span class="ctx" hidden><span class="ctx-bar"><span class="ctx-fill"></span></span><span class="ctx-num"></span></span><span class="memo" hidden><span class="memo-pen" data-icon="pencil"></span><span class="memo-text"></span><textarea rows="1" spellcheck="false" data-i18n-aria-label="widget.holdNoteAria"></textarea></span></span>
      </span>
      <button class="act" tabindex="-1" data-i18n-aria-label="widget.archive" data-icon="archive"></button>
    </li>
  </template>

  <script type="module" src="renderer.js"></script>
</body>
</html>
